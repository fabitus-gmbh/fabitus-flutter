name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # A single resolve for the whole workspace.
      - name: Install dependencies
        run: dart pub get

      # Generated code is committed so consumers need no build step. Regenerate
      # it here and fail if the committed output has drifted.
      - name: Regenerate code
        run: dart run build_runner build
        working-directory: packages/fabitus_crud_api

      - name: Verify committed generated code is up to date
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated code is out of date. Run 'dart run build_runner build' in the affected package and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test
        working-directory: packages/fabitus_crud_api
