name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One package depends on Flutter, which makes the whole workspace resolve
      # through the Flutter SDK. The Dart SDK it bundles serves format/analyze.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # A single resolve for the whole workspace.
      - name: Install dependencies
        run: flutter pub get

      # Generated code is committed so consumers need no build step. Regenerate
      # it here and fail if the committed output has drifted.
      - name: Regenerate code
        run: |
          for pkg in packages/*/; do
            if grep -q '^  build_runner:' "$pkg/pubspec.yaml"; then
              echo "::group::build_runner in $pkg"
              (cd "$pkg" && dart run build_runner build)
              echo "::endgroup::"
            fi
          done

      - name: Verify committed generated code is up to date
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated code is out of date. Run 'dart run build_runner build' in the affected package and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: |
          for pkg in packages/*/; do
            echo "::group::tests in $pkg"
            if grep -q '^  flutter:$' "$pkg/pubspec.yaml"; then
              (cd "$pkg" && flutter test)
            else
              (cd "$pkg" && dart test)
            fi
            echo "::endgroup::"
          done
