name: fabitus_flutter
description: >-
  Dart workspace root for the Fabitus Flutter/Dart library mono repo.
  This package is not published; it only wires up the workspace members.
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - packages/fabitus_crud_api
  - packages/fabitus_crud_api_bloc
  - packages/fabitus_crud_api_dio
  - packages/fabitus_feature_modules
  - packages/fabitus_problem_details

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
