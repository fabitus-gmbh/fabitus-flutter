name: fabitus_crud_api_bloc
description: >-
  Cubits and widgets for driving fabitus_crud_api repositories from Flutter:
  loading one value, paging through a collection, and editing one entity.
version: 0.1.0
repository: https://github.com/fabitus-gmbh/fabitus-flutter
issue_tracker: https://github.com/fabitus-gmbh/fabitus-flutter/issues

# Depends on its sibling by path, which pub.dev does not accept. That is fine
# for the git dependency this repo is consumed through - pub resolves the path
# inside the clone. Publishing to pub.dev would mean a version constraint here.
publish_to: none

topics:
  - bloc
  - cubit
  - crud
  - pagination

# Resolved together with the other packages of the workspace root.
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.24.0"

dependencies:
  collection: ^1.19.0
  fabitus_crud_api:
    path: ../fabitus_crud_api
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  meta: ^1.16.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
