name: fabitus_cognito_auth_dio
description: >-
  Dio interceptor for fabitus_cognito_auth: attaches the Cognito token to API
  requests, refreshes it before it expires and once more on a 401.
version: 0.1.0
repository: https://github.com/fabitus-gmbh/fabitus-flutter
issue_tracker: https://github.com/fabitus-gmbh/fabitus-flutter/issues

# Depends on its sibling by path, which pub.dev does not accept. That is fine
# for the git dependency this repo is consumed through - pub resolves the path
# inside the clone. Publishing to pub.dev would mean a version constraint here.
publish_to: none

topics:
  - dio
  - cognito
  - authentication

# Resolved together with the other packages of the workspace root.
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  dio: ^5.11.0
  fabitus_cognito_auth:
    path: ../fabitus_cognito_auth
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
