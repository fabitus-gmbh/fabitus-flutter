name: fabitus_crud_api
description: >-
  Spring Data style CRUD repository, pagination and error handling abstractions
  for Dart and Flutter, with in-memory, key-value and remote implementations.
version: 0.1.0
repository: https://github.com/fabitus-gmbh/fabitus-flutter
issue_tracker: https://github.com/fabitus-gmbh/fabitus-flutter/issues
topics:
  - crud
  - repository
  - pagination
  - rest

# Resolved together with the other packages of the workspace root.
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  collection: ^1.19.0
  freezed_annotation: ^3.1.0
  logging: ^1.3.0
  meta: ^1.16.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ">=2.4.0 <3.0.0"
  # freezed 4 requires Dart >= 3.13; pinned to the 3.x line until the SDK
  # constraint of this package is raised.
  freezed: ^3.2.5
  lints: ^6.0.0
  test: ^1.26.0
