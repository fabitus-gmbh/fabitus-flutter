name: fabitus_crud_api_dio
description: >-
  Dio adapter for fabitus_crud_api: a ready made CrudErrorMapper that turns
  DioExceptions into CrudExceptions, reading RFC 9457 problem details.
version: 0.1.0
repository: https://github.com/fabitus-gmbh/fabitus-flutter
issue_tracker: https://github.com/fabitus-gmbh/fabitus-flutter/issues

# Depends on its siblings by path, which pub.dev does not accept. That is fine
# for the git dependency this repo is consumed through - pub resolves the paths
# inside the clone. Publishing to pub.dev would mean version constraints here.
publish_to: none

topics:
  - dio
  - crud
  - error-handling
  - rfc9457

# Resolved together with the other packages of the workspace root.
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  dio: ^5.11.0
  fabitus_crud_api:
    path: ../fabitus_crud_api
  fabitus_problem_details:
    path: ../fabitus_problem_details
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
