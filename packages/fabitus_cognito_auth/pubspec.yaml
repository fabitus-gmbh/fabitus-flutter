name: fabitus_cognito_auth
description: >-
  Username and password login against an AWS Cognito user pool, with session
  restore, token refresh and the NEW_PASSWORD_REQUIRED challenge, for APIs
  behind an API Gateway Cognito authorizer.
version: 0.1.0
repository: https://github.com/fabitus-gmbh/fabitus-flutter
issue_tracker: https://github.com/fabitus-gmbh/fabitus-flutter/issues
topics:
  - cognito
  - aws
  - authentication
  - bloc

# Resolved together with the other packages of the workspace root.
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  amazon_cognito_identity_dart_2: ^4.0.0
  bloc: ^9.1.0
  freezed_annotation: ^3.1.0
  http: ^1.2.0
  meta: ^1.16.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ">=2.4.0 <3.0.0"
  # freezed 4 requires Dart >= 3.13; pinned to the 3.x line until the SDK
  # constraint of this package is raised.
  freezed: ^3.2.5
  lints: ^6.0.0
  test: ^1.26.0
