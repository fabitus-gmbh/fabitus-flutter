name: fabitus_problem_details
description: >-
  RFC 9457 (formerly RFC 7807) problem details for HTTP APIs, with tolerant
  parsing of the shapes Spring Boot and Zalando's problem library emit.
version: 0.1.0
repository: https://github.com/fabitus-gmbh/fabitus-flutter
issue_tracker: https://github.com/fabitus-gmbh/fabitus-flutter/issues
topics:
  - rfc9457
  - rfc7807
  - http
  - error-handling

# Resolved together with the other packages of the workspace root.
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  collection: ^1.19.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  build_runner: ">=2.4.0 <3.0.0"
  # Only for the test that compiles the README's fabitus_crud_api bridge; the
  # package itself does not depend on it.
  fabitus_crud_api:
    path: ../fabitus_crud_api
  # freezed 4 requires Dart >= 3.13; pinned to the 3.x line until the SDK
  # constraint of this package is raised.
  freezed: ^3.2.5
  lints: ^6.0.0
  test: ^1.26.0
